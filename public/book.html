<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>书籍详情 · 青简</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body data-page="book">
  <header class="topbar">
    <span class="logo">青简</span>
    <form class="search" onsubmit="return false">
      <input type="search" placeholder="搜索书名/作者" aria-label="搜索">
      <button type="button" aria-label="搜索">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      </button>
    </form>
  </header>

  <div class="wrap">
    <a class="back-link" href="/shelf.html">‹ 返回书架</a>
    <div class="book-head" id="head"></div>
    <div id="intro"></div>

    <div class="section-title" id="chapterDirTitle">章节目录 <span class="more">共 <span id="chapterCount">0</span> 章</span></div>
    <div id="chapterWarn" class="warn"></div>
    <div class="chapter-tools">
      <div class="order-seg" id="orderSeg" role="group" aria-label="章节排序">
        <button type="button" data-order="desc" class="on">倒序</button>
        <button type="button" data-order="asc">正序</button>
      </div>
    </div>
    <div class="chapter-list" id="chapters"></div>
    <div class="chapter-pager" id="chapterPager"></div>
  </div>

  <div id="error" class="empty"></div>
  <script src="/assets/app.js"></script>
</body>
</html>
